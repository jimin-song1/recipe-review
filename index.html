<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>레시피 검수</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1b; --sub: #6b6a66; --line: #e6e4df;
    --accent: #03c75a; --accent-ink: #ffffff; --warn: #c2410c; --chip: #efede8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --card: #1f1f1d; --ink: #f1f0ec; --sub: #a3a29d; --line: #2f2f2c;
      --accent: #1fd170; --accent-ink: #0b0b0b; --warn: #fb923c; --chip: #2a2a27; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
    padding: 12px 16px 0; padding-top: calc(12px + env(safe-area-inset-top)); }
  h1 { font-size: 18px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
  h1 button { font-size: 14px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; }
  .tab { border: 0; background: var(--chip); color: var(--ink); padding: 6px 12px; border-radius: 999px; font-size: 14px; white-space: nowrap; }
  .tab.on { background: var(--ink); color: var(--bg); }
  main { max-width: 720px; margin: 0 auto; padding: 12px 16px 120px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; cursor: pointer; }
  .card .t { font-weight: 700; }
  .meta { color: var(--sub); font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--chip); }
  .badge.publish_requested, .badge.publishing { background: #fff3c4; color: #7a5a00; }
  .badge.published { background: #d7f5e3; color: #05622f; }
  .badge.failed { background: #ffe0d1; color: var(--warn); }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 12px; }
  .primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .empty { color: var(--sub); text-align: center; padding: 48px 0; }
  .post h2 { font-size: 21px; line-height: 1.4; margin: 6px 0 18px; }
  .post p { margin: 0; min-height: 1.6em; }
  .post h3 { font-size: 19px; margin: 0; }
  .pic { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 10px; margin: 6px 0; background: var(--chip); }
  .pic.ph { display: flex; align-items: center; justify-content: center; color: var(--sub); font-size: 13px; }
  .imgbox { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 14px; }
  .imgbox .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .imgbox .row > * { flex: 1; }
  .pic.ph { cursor: pointer; border: 1px dashed var(--line); }
  .when { font-weight: 700; }
  textarea.copy { min-height: 140px; font-size: 13px; margin-top: 8px; }
  .post hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; justify-content: center; }
  .bar button { flex: 1; max-width: 220px; }
  input, textarea { width: 100%; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  textarea { min-height: 60vh; font-size: 15px; }
  .help { color: var(--sub); font-size: 13px; margin: 6px 0 12px; }
  .note { color: var(--warn); font-size: 14px; margin-bottom: 10px; }
  a { color: var(--accent); }
  .badge.link_wait { background: #fff3c4; color: #7a5a00; }
  .badge.linked { background: #d7f5e3; color: #05622f; }
  .badge.link_skip { background: var(--chip); color: var(--sub); }
  .tcard { cursor: default; }
  .tcard .body { white-space: pre-line; margin-top: 8px; font-size: 15px; }
  .kind { font-size: 12px; padding: 1px 8px; border-radius: 999px; font-weight: 700; }
  .kind.link { background: #ffe4cc; color: #9a3a00; }
  .kind.talk { background: #dbeafe; color: #1e40af; }
  .checks { display: flex; gap: 12px; flex-wrap: wrap; font-size: 14px; margin-top: 6px; font-weight: 600; }
  .sec { font-size: 16px; margin: 18px 0 8px; } .sec small { color: var(--sub); font-weight: 400; }
  .empty.small { padding: 12px 0; font-size: 14px; }
  .tcard.todo { border: 2px solid var(--accent); }
  .tbtn { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; clear: both; }
  .tbtn > * { flex: 1; text-align: center; }
  .btnlike { border-radius: 10px; border: 1px solid var(--line); padding: 8px 12px; color: var(--ink); text-decoration: none; background: var(--card); }
  .prod { font-size: 13px; color: var(--sub); margin-top: 6px; }
  .tcard img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; float: right; margin: 0 0 6px 10px; background: var(--chip); }
  .tcard .reply { white-space: pre-line; font-size: 13px; color: var(--sub); border-left: 3px solid var(--line); padding-left: 8px; margin-top: 8px; word-break: break-all; }
  .sum { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; color: var(--sub); }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
    padding: 8px 14px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1><span id="hTitle">레시피 검수</span> <button id="hBtn">새로고침</button></h1>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="main"></main>
<div class="bar" id="bar" hidden></div>
<div class="toast" id="toast"></div>

<script>
const STATUS = {
  draft: '검수 대기', publish_requested: '예약 중', scheduled: '예약됨', publishing: '발행 중',
  published: '발행 완료', failed: '발행 실패', rejected: '보류'
};
const TABS = [
  ['draft', '검수 대기', ['draft', 'failed']],
  ['queue', '발행 예약', ['publish_requested', 'scheduled', 'publishing']],
  ['done', '발행 완료', ['published']],
  ['rejected', '보류', ['rejected']],
];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let cfg = {}, posts = [], tab = 'draft', current = null, threads = [];
const T_STATUS = { published: '발행 완료', link_wait: '발행 완료 · 링크 대기', linked: '발행 완료 · 링크 달림',
  link_skip: '발행 완료 · 링크 안 담', failed: '발행 실패' };

const DEFAULT_API = 'https://script.google.com/macros/s/AKfycbwxiSopXrZHBD5oizJBvveLcU6JemqhvyxGr_6XTRdRkyafILkCx3xvDkEOG3pAyWr-/exec';
// 저장: localStorage → 안 되면 쿠키 (사파리 개인정보 보호·앱 내 브라우저 대비)
function store(k, v) {
  try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {}
  try {
    document.cookie = v === undefined
      ? `rr_${k}=; max-age=0; path=/; SameSite=Lax`
      : `rr_${k}=${encodeURIComponent(v)}; max-age=31536000; path=/; SameSite=Lax; Secure`;
  } catch (e) {}
}
function load(k) {
  let v = null;
  try { v = localStorage.getItem(k); } catch (e) {}
  if (!v) {
    const m = document.cookie.match(new RegExp('(?:^|; )rr_' + k + '=([^;]*)'));
    if (m) v = decodeURIComponent(m[1]);
  }
  return v;
}
let toastT = null;
function toast(msg, sticky) {   // sticky: 다음 메시지가 올 때까지 계속 표시
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); if (!sticky) toastT = setTimeout(() => t.classList.remove('show'), 1800);
}

// 설정: 주소 뒤 #api=...&key=... 로 한 번 열면 저장됨
function initCfg() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('key')) {
    cfg = { api: h.get('api') || DEFAULT_API, key: h.get('key') };
    store('api', cfg.api); store('key', cfg.key);
  }
  cfg = { api: cfg.api || load('api') || DEFAULT_API, key: cfg.key || load('key') };
}

async function api(params) {
  const u = new URL(cfg.api);
  Object.entries({ ...params, key: cfg.key }).forEach(([k, v]) => u.searchParams.set(k, v));
  const r = await fetch(u, { redirect: 'follow' });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'API 오류');
  return j;
}
async function post(body) {
  const r = await fetch(cfg.api, { method: 'POST', body: JSON.stringify({ ...body, key: cfg.key }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'API 오류');
  return j;
}

function render(md, imgs) {   // 봇 마크업 → 미리보기
  let map = {};
  try { map = imgs ? JSON.parse(imgs) : {}; } catch (e) {}
  return md.split('\n').map(l => {
    const m = l.trim().match(/^\[\[img:([^\]]+)\]\]$/);
    if (m) return map[m[1]]
      ? `<img class="pic" src="${esc(map[m[1]])}" alt="" loading="lazy" referrerpolicy="no-referrer">`
      : `<div class="pic ph">그림 ${esc(m[1])}</div>`;
    if (l.trim() === '---') return '<hr>';
    if (l.startsWith('## ')) return `<h3>${esc(l.slice(3))}</h3>`;
    if (l.startsWith('** ')) return `<p><b>${esc(l.slice(3))}</b></p>`;
    return `<p>${esc(l)}</p>`;
  }).join('');
}

function fmt(iso) {
  const d = new Date(iso); if (isNaN(d)) return '';
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function whenText(at) {
  if (at === 'now') return '곧 발행';
  if (!at || isNaN(+at)) return '';
  const d = new Date(+at * 1000);
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')} 발행 예정`;
}
function slots(body) { return [...(body || '').matchAll(/^\[\[img:([^\]]+)\]\]$/gm)].map(m => m[1]); }
function imgMap(p) { try { return p.images ? JSON.parse(p.images) : {}; } catch (e) { return {}; } }

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove(); return ok;
}

// 크기는 그대로(최대 2048px), 1MB 넘는 그림만 고화질 JPEG(92%)로 바꿔 용량을 줄임
function toBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = rej; r.readAsDataURL(file);
  });
}
function prepare(file) {
  if (file.size <= 1024 * 1024) return toBase64(file).then(data => ({ data, mime: file.type || 'image/png' }));
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 2048 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res({ data: c.toDataURL('image/jpeg', 0.92).split(',')[1], mime: 'image/jpeg' });
    };
    img.onerror = rej; img.src = url;
  });
}

async function uploadTo(p, files, names) {
  for (let i = 0; i < files.length && i < names.length; i++) {
    toast(`그림 올리는 중 ${i + 1}/${Math.min(files.length, names.length)} · 화면을 켜두세요`, true);
    try { const x = await prepare(files[i]); await post({ action: 'img', id: p.id, name: names[i], mime: x.mime, data: x.data }); }
    catch (e) { toast('실패: ' + e.message); return; }
  }
  toast('그림 올리기 완료');
  openPost(p.id);
}

function pickFiles(multiple, cb) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.multiple = multiple;
  inp.accept = multiple ? 'image/*,.zip,application/zip' : 'image/*';
  inp.onchange = () => cb([...inp.files]); inp.click();
}

// ZIP 풀기: 외부 라이브러리 없이 브라우저 내장 DecompressionStream 사용
async function unzip(file) {
  const buf = new Uint8Array(await file.arrayBuffer()), dv = new DataView(buf.buffer);
  let eocd = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('압축 파일을 읽을 수 없어요');
  let off = dv.getUint32(eocd + 16, true); const n = dv.getUint16(eocd + 10, true), out = [];
  for (let k = 0; k < n; k++) {
    const method = dv.getUint16(off + 10, true), csize = dv.getUint32(off + 20, true);
    const nl = dv.getUint16(off + 28, true), el = dv.getUint16(off + 30, true), cl = dv.getUint16(off + 32, true);
    const lho = dv.getUint32(off + 42, true), name = new TextDecoder().decode(buf.subarray(off + 46, off + 46 + nl));
    off += 46 + nl + el + cl;
    if (name.endsWith('/') || !/\.(png|jpe?g|webp)$/i.test(name) || /(^|\/)(__MACOSX|\.)/.test(name)) continue;
    const start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
    const raw = buf.subarray(start, start + csize);
    let data;
    if (method === 0) data = raw;
    else if (method === 8) data = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    else continue;
    const type = /\.png$/i.test(name) ? 'image/png' : /\.webp$/i.test(name) ? 'image/webp' : 'image/jpeg';
    out.push(new File([data], name.split('/').pop(), { type }));
  }
  return out.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
}

// 압축 파일이 섞여 있으면 풀어서 그림 파일 목록으로 (파일 이름순)
async function expandZips(files) {
  const out = [];
  for (const f of files) {
    if (!/\.zip$/i.test(f.name) && !/zip/.test(f.type)) { out.push(f); continue; }
    toast('압축 푸는 중…', true);
    out.push(...await unzip(f));
  }
  return out;
}

// 파일 이름이 자리 이름(00_cover 등)과 같으면 그 자리에, 나머지는 빈 자리에 순서대로
function assign(files, names, map) {
  const stem = n => n.replace(/\.[^.]+$/, '').toLowerCase();
  const byName = {}, rest = [];
  files.forEach(f => { const m = names.find(n => stem(n) === stem(f.name)); m && !byName[m] ? byName[m] = f : rest.push(f); });
  const free = names.filter(n => !byName[n]);
  const target = rest.length >= free.length ? free : free.filter(n => !map[n]).concat(free.filter(n => map[n]));
  rest.forEach((f, i) => { if (target[i]) byName[target[i]] = f; });
  const pairs = names.filter(n => byName[n]).map(n => [n, byName[n]]);
  return [pairs.map(p => p[1]), pairs.map(p => p[0])];
}

function drawTabs() {
  $('tabs').innerHTML = TABS.map(([id, label, sts]) => {
    const n = posts.filter(p => sts.includes(p.status)).length;
    return `<button class="tab ${tab === id ? 'on' : ''}" data-t="${id}">${label} ${n}</button>`;
  }).join('') + `<button class="tab ${tab === 'threads' ? 'on' : ''}" data-t="threads">🧵 스레드 ${threads.filter(t => t.status === 'ready' || t.status === 'link_ready').length ? '🔴 ' + threads.filter(t => t.status === 'ready' || t.status === 'link_ready').length : threads.length}</button>`;
  $('tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.t; showList(); });
}

function showSetup() {
  $('tabs').innerHTML = ''; $('bar').hidden = true; $('hBtn').hidden = true;
  $('main').innerHTML = `
    <h2>처음 설정</h2>
    <p class="help">접속 키만 입력하면 돼요. 주소는 이미 들어가 있어요.</p>
    <label>Apps Script 웹 앱 주소<input id="sApi" value="${esc(cfg.api || DEFAULT_API)}"></label>
    <p></p><label>접속 키<input id="sKey"></label><p></p>
    <button class="primary" id="sSave">저장</button>`;
  $('sSave').onclick = () => {
    cfg = { api: $('sApi').value.trim() || DEFAULT_API, key: $('sKey').value.trim() };
    if (!cfg.key) return toast('접속 키를 입력하세요');
    store('api', cfg.api); store('key', cfg.key);
    refresh();
  };
}

async function refresh() {
  if (!cfg.api || !cfg.key) return showSetup();
  $('hBtn').hidden = false;
  try {
    posts = (await api({ light: 1 })).posts;
    try { threads = (await api({ sheet: 'threads' })).posts || []; } catch (e) { threads = []; }
  } catch (e) {
    $('main').innerHTML = `<p class="note">불러오기 실패: ${esc(e.message)}</p><button id="reset">설정 다시 하기</button>`;
    $('reset').onclick = () => { store('api'); store('key'); cfg = {}; showSetup(); };
    return;
  }
  current ? null : showList();
}

function showList() {
  current = null; $('bar').hidden = true; $('hTitle').textContent = '레시피 검수'; $('hBtn').textContent = '새로고침';
  $('hBtn').onclick = refresh;
  drawTabs();
  if (tab === 'threads') return showThreads();
  const sts = TABS.find(t => t[0] === tab)[2];
  const list = posts.filter(p => sts.includes(p.status));
  $('main').innerHTML = list.length ? list.map(p => `
    <div class="card" data-id="${esc(p.id)}">
      <div class="t">${esc(p.title)}</div>
      <div class="meta"><span class="badge ${esc(p.status)}">${STATUS[p.status] || esc(p.status)}</span>
        <span>${esc(p.category || p.slot)}</span><span>${fmt(p.created)}</span>${p.edited ? '<span>수정됨</span>' : ''}
        ${p.status === 'scheduled' || p.status === 'publish_requested' ? `<span class="when">${whenText(p.publish_at) || '시간 정하는 중'}</span>` : ''}</div>
      ${p.status === 'failed' && p.note ? `<div class="note">${esc(p.note)}</div>` : ''}
      ${p.url ? `<div class="meta"><a href="${esc(p.url)}" target="_blank" rel="noopener">블로그에서 보기</a></div>` : ''}
    </div>`).join('') : `<div class="empty">글이 없어요</div>`;
  $('main').querySelectorAll('.card').forEach(c => c.onclick = () => openPost(c.dataset.id));
}

function checks(t) {   // ✅ 끝난 단계 / ⬜ 아직 / ➖ 해당 없음
  const isLink = t.kind === 'link';
  const s = t.status;
  const pub = s === 'ready' ? '⬜ 폰으로 올리기' : s === 'skipped' ? '➖ 건너뜀' : '✅ 올림';
  if (!isLink) return `<span>${pub}</span><span>➖ 링크 없음 (공감글)</span>`;
  const link = s === 'linked' ? '✅ 링크 달림' : s === 'link_ready' ? '🔗 지금 링크 달 차례' :
    s === 'link_skip' ? '➖ 링크 안 담 (30분 조회 부족)' : s === 'ready' || s === 'skipped' ? '⬜ 링크' : '⏳ 조회수 확인 중 (30분 안에 300)';
  return `<span>${pub}</span><span>${link}</span>`;
}

function tcard(t) {
  const btns = t.status === 'ready' ? `
      <div class="row tbtn">
        <button data-a="copy" data-id="${esc(t.id)}">① 본문 복사</button>
        ${t.image ? `<a class="btnlike" href="${esc(t.image)}" target="_blank" rel="noopener">② 사진 열기·저장</a>` : ''}
        <button class="primary" data-a="posted" data-id="${esc(t.id)}">③ 올렸어요 ✅</button>
      </div>
      <div class="row tbtn"><button data-a="skip" data-id="${esc(t.id)}">이 글 건너뛰기</button></div>`
    : t.status === 'link_ready' ? `
      <div class="reply">${esc(t.reply)}</div>
      <div class="row tbtn">
        <button data-a="copyreply" data-id="${esc(t.id)}">① 링크 타래 복사</button>
        <button class="primary" data-a="linked" data-id="${esc(t.id)}">② 링크 달았어요 ✅</button>
      </div>` : '';
  return `
    <div class="card tcard ${t.status === 'ready' || t.status === 'link_ready' ? 'todo' : ''}">
      ${t.image ? `<img src="${esc(t.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ''}
      <div class="t">${esc(t.first_line)}</div>
      <div class="meta">${t.kind === 'link' ? '<span class="kind link">🛒 링크글</span>' : '<span class="kind talk">💬 공감글</span>'}
        <span>${fmt(t.posted_at || t.created)}</span>${t.views ? `<span>조회 ${(+t.views).toLocaleString()}</span>` : ''}
        ${t.url ? `<a href="${esc(t.url)}" target="_blank" rel="noopener">스레드에서 보기</a>` : ''}</div>
      <div class="checks">${checks(t)}</div>
      ${t.note ? `<div class="note">${esc(t.note)}</div>` : ''}
      <div class="body">${esc(t.body)}</div>
      ${t.product ? `<div class="prod">소개한 상품: ${esc(t.product)}</div>` : ''}
      ${t.status === 'linked' && t.reply ? `<div class="reply">${esc(t.reply)}</div>` : ''}
      ${btns}
    </div>`;
}

function showThreads() {
  $('hTitle').textContent = '스레드';
  const ready = threads.filter(t => t.status === 'ready'), linkr = threads.filter(t => t.status === 'link_ready');
  const rest = threads.filter(t => t.status !== 'ready' && t.status !== 'link_ready' && t.status !== 'skipped');
  const linked = threads.filter(t => t.status === 'linked').length;
  const views = rest.reduce((a, t) => a + (+t.views || 0), 0);
  const sec = (title, list, empty) => `<h3 class="sec">${title} <small>${list.length}</small></h3>` +
    (list.length ? list.map(tcard).join('') : `<div class="empty small">${empty}</div>`);
  $('main').innerHTML =
    sec('🔗 링크 달 차례', linkr, '지금은 없어요') +
    sec('📱 지금 올릴 글', ready, '봇이 정한 시간에 여기 올라와요') +
    `<div class="sum"><span>올린 글 ${rest.length}개</span><span>링크 달림 ${linked}</span><span>조회 합계 ${views.toLocaleString()}</span></div>` +
    sec('✅ 올린 글', rest, '아직 없어요');
  $('main').querySelectorAll('.tbtn [data-a]').forEach(b => b.onclick = async ev => {
    ev.stopPropagation();
    const t = threads.find(x => x.id === b.dataset.id); if (!t) return;
    const a = b.dataset.a;
    if (a === 'copy') return toast(await copyText(t.body) ? '본문 복사했어요. 스레드에 붙여넣으세요' : '복사 실패 - 길게 눌러 복사하세요');
    if (a === 'copyreply') return toast(await copyText(t.reply) ? '링크 타래 복사했어요. 내 글에 답글로 붙여넣으세요' : '복사 실패');
    if (b.dataset.armed !== '1') { b.dataset.armed = '1'; const o = b.textContent; b.textContent = '한 번 더 누르면 확정'; setTimeout(() => { b.dataset.armed = ''; b.textContent = o; }, 4000); return; }
    const fields = a === 'posted' ? { status: 'posted', posted_at: new Date().toISOString() }
      : a === 'linked' ? { status: 'linked' } : { status: 'skipped' };
    toast('처리 중…');
    try { await post({ action: 'tupdate', id: t.id, fields }); } catch (e) { return toast('실패: ' + e.message); }
    toast(a === 'posted' ? (t.kind === 'link' ? '좋아요! 30분 동안 조회수 지켜볼게요' : '올림 처리했어요') : a === 'linked' ? '링크 달림 처리했어요' : '건너뛰었어요');
    await refresh(); tab = 'threads'; showList();
  });
}

async function openPost(id, edit = false) {
  $('main').innerHTML = '<div class="empty">불러오는 중…</div>';
  try { current = (await api({ action: 'get', id })).post; } catch (e) { toast(e.message); return showList(); }
  if (!current) return showList();
  $('tabs').innerHTML = '';
  $('hTitle').textContent = STATUS[current.status] || '';
  $('hBtn').textContent = '목록'; $('hBtn').onclick = () => { current = null; refresh(); };
  const p = current;
  if (edit) {
    $('main').innerHTML = `
      <input id="eTitle" value="${esc(p.title)}">
      <p class="help">## 큰 소제목 · ** 굵은 줄 · --- 구분선 · [[img:파일]] 그림 위치(지우면 그림 빠짐) · 빈 줄은 문단 간격</p>
      <textarea id="eBody">${esc(p.body)}</textarea>`;
  } else {
    const names = slots(p.body), map = imgMap(p), have = names.filter(n => map[n]).length;
    const editable = ['draft', 'failed', 'rejected'].includes(p.status);
    $('main').innerHTML = `
      ${p.note ? `<div class="note">${esc(p.note)}</div>` : ''}
      ${p.status === 'scheduled' ? `<p class="when">${whenText(p.publish_at)}</p>` : ''}
      ${names.length && editable ? `<div class="imgbox">
        <b>그림 ${have}/${names.length}장</b>
        <div class="help">① 요청문 복사 → ChatGPT(스킬 있는 채팅)에 붙여넣기 → ② ChatGPT가 준 ZIP 파일(또는 그림들)을 선택. 파일 이름이 00_cover처럼 같으면 그 자리로 들어가요. 빈 칸을 누르면 그 자리만 올려요.</div>
        <div class="row"><button id="cp">① 그림 요청 복사</button><button class="primary" id="up">② 그림 올리기</button></div>
      </div>` : ''}
      <article class="post"><h2>${esc(p.title)}</h2>${render(p.body, p.images)}</article>
      ${p.url ? `<p><a href="${esc(p.url)}" target="_blank" rel="noopener">블로그에서 보기</a></p>` : ''}`;
  }
  if (!edit) {
    const names = slots(p.body), map = imgMap(p);
    if ($('cp')) $('cp').onclick = async () => {
      if (await copyText(p.img_prompt || '')) return toast('복사했어요. ChatGPT에 붙여넣으세요');
      const ta = document.createElement('textarea'); ta.className = 'copy'; ta.value = p.img_prompt || '';
      $('cp').closest('.imgbox').append(ta); ta.focus(); ta.select(); toast('길게 눌러 복사하세요');
    };
    if ($('up')) $('up').onclick = () => pickFiles(true, async files => {
      try { files = await expandZips(files); } catch (e) { return toast(e.message); }
      if (!files.length) return toast('그림 파일이 없어요');
      const [fs, ns] = assign(files, names, map);
      uploadTo(p, fs, ns);
    });
    if (['draft', 'failed', 'rejected'].includes(p.status)) {
      const els = $('main').querySelectorAll('.post .pic');
      els.forEach((el, i) => { el.style.cursor = 'pointer'; el.onclick = () => pickFiles(false, f => uploadTo(p, f, [names[i]])); });
    }
  }
  const bar = $('bar'); bar.hidden = false;
  const btn = (label, cls, fn) => { const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls; b.onclick = function (ev) { return fn.call(b, ev); }; return b; };
  bar.innerHTML = '';
  if (edit) {
    bar.append(
      btn('취소', '', () => openPost(p.id)),
      btn('저장', '', () => act({ action: 'save', id: p.id, title: $('eTitle').value, body: $('eBody').value }, '저장했어요', true)),
      btn('저장 후 발행', 'primary', () => act({ action: 'publish', id: p.id, title: $('eTitle').value, body: $('eBody').value }, '발행 요청했어요')));
  } else if (p.status === 'draft' || p.status === 'failed') {
    bar.append(
      btn('보류', '', () => act({ action: 'reject', id: p.id }, '보류했어요')),
      btn('수정', '', () => openPost(p.id, true)),
      btn('발행 예약', 'primary', function () {
        // 일부 모바일/앱 브라우저는 confirm 창을 막아서 화면 안에서 두 번 누르기로 확인
        const names = slots(p.body), have = names.filter(n => imgMap(p)[n]).length;
        if (this.dataset.armed) return act({ action: 'publish', id: p.id }, '예약했어요. 발행 시간은 무작위로 정해져요');
        this.dataset.armed = '1';
        this.textContent = have < names.length ? `그림 ${names.length - have}장 없음 · 한 번 더` : '한 번 더 누르면 예약';
        setTimeout(() => { delete this.dataset.armed; this.textContent = '발행 예약'; }, 4000);
      }));
  } else if (p.status === 'scheduled' || p.status === 'publish_requested') {
    bar.append(
      btn('예약 취소', '', () => act({ action: 'restore', id: p.id }, '예약을 취소했어요')),
      btn('지금 바로 발행', 'primary', function () {
        if (this.dataset.armed) return act({ action: 'publish', id: p.id, now: true }, 'sjm이 5분 안에 발행해요');
        this.dataset.armed = '1'; this.textContent = '한 번 더 누르면 발행';
        setTimeout(() => { delete this.dataset.armed; this.textContent = '지금 바로 발행'; }, 4000);
      }));
  } else if (p.status === 'rejected') {
    bar.append(btn('검수 대기로 되돌리기', '', () => act({ action: 'restore', id: p.id }, '되돌렸어요')));
  } else {
    bar.hidden = true;
  }
}

async function act(body, msg, reopen) {
  toast('처리 중…');
  $('bar').querySelectorAll('button').forEach(b => b.disabled = true);
  try { await post(body); toast(msg); } catch (e) {
    $('bar').querySelectorAll('button').forEach(b => b.disabled = false);
    return toast('실패: ' + e.message);
  }
  current = null;
  await refresh();
  if (reopen) openPost(body.id);
}

initCfg();
refresh();
setInterval(() => { if (!current && document.visibilityState === 'visible') refresh(); }, 30000);
</script>
</body>
